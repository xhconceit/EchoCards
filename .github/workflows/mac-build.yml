name: macOS Build

on:
  pull_request:
    paths:
      - "mac/**"
      - ".github/workflows/mac-build.yml"

  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "mac/**"
      - ".github/workflows/mac-build.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build macOS APP
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: mac
        run: xcodegen generate

      - name: Run macOS tests
        working-directory: mac
        run: |
          xcodebuild test \
            -project EchoCards.xcodeproj \
            -scheme EchoCards \
            -destination 'platform=macOS' \
            -derivedDataPath .build/xcode \
            CODE_SIGNING_ALLOWED=NO

      - name: Create release archive
        working-directory: mac
        run: |
          xcodebuild archive \
            -project EchoCards.xcodeproj \
            -scheme EchoCards \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath dist/EchoCards.xcarchive \
            -derivedDataPath .build/xcode \
            CODE_SIGNING_ALLOWED=NO

      - name: Package macOS app
        working-directory: mac
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/EchoCards.xcarchive/Products/Applications/EchoCards.app \
            dist/EchoCards-unsigned.zip

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: EchoCards-macOS-unsigned
          path: mac/dist/EchoCards-unsigned.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download packaged app
        uses: actions/download-artifact@v8
        with:
          name: EchoCards-macOS-unsigned
          path: release

      - name: Create GitHub per-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/EchoCards-unsigned.zip \
            --title "EchoCards $GITHUB_REF_NAME" \
            --generate-notes \
            --prerelease

