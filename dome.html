
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知声卡 EchoCards · 首页 / 卡片详情 / 学习</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
/* ============================================================
   知声卡 · 视觉系统
   画布 #F7F8F8 / 卡面 #FFF / 墨 #101314
   青碧 #0E9A9A  —— 仅图形与大字（环、呼吸点、焦点）
   青碧深 #0A7373 —— 白字填充与小号文字（AA）
   卡堆构造（三屏统一）：顶卡 + 一张以右下角为轴的 45° 卡
   按压反馈：液态玻璃 —— 高光 + 暗角 + 边缘增厚 + 压弯
   ============================================================ */
:root{
  --bg:#F7F8F8;
  --surface:#FFFFFF;
  --fg:#101314;
  --muted:#6B7376;
  --faint:#9AA3A4;
  --border:#E7EAEA;
  --track:#ECEFEF;
  --teal:#0E9A9A;
  --teal-deep:#0A7373;
  --font:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif;
  --lat:'Manrope',var(--font);
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{background:#EFF2F2}
body{
  font-family:var(--font);color:var(--fg);
  letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
  padding:40px 32px 72px;min-height:100vh;
}
.board-head{max-width:1380px;margin:0 auto 30px;display:flex;align-items:baseline;gap:10px}
.board-head h1{font-size:15px;font-weight:700;letter-spacing:-.03em}
.board-head span{font:400 11px/1 var(--mono);color:var(--muted);letter-spacing:.2em;text-transform:uppercase}
.board{display:flex;gap:38px;justify-content:center;align-items:flex-start;flex-wrap:wrap;max-width:1380px;margin:0 auto}
.device{display:flex;flex-direction:column;align-items:center;gap:14px}
figcaption{font:400 11px/1 var(--mono);color:var(--muted);letter-spacing:.22em}

/* ---------- 机身 ---------- */
.phone{background:#0C0F10;padding:9px;border-radius:46px;box-shadow:0 26px 64px rgba(12,22,22,.20)}
.screen{
  position:relative;width:412px;height:900px;border-radius:37px;overflow:hidden;
  background:var(--bg);display:flex;flex-direction:column;
  font-size:15px;line-height:1.45;letter-spacing:-.01em;
}
.punch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:#0C0F10;z-index:70;pointer-events:none}
.statusbar{flex:none;height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:var(--fg)}
.sb-time{font:600 12px/1 var(--lat);letter-spacing:.01em}
.sb-icons{display:flex;align-items:center;gap:5px;opacity:.82}
.sb-icons svg{height:11px;width:auto;display:block}
.gesture{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;width:116px;height:4px;border-radius:99px;background:rgba(16,19,20,.24);z-index:60;pointer-events:none}
.app-slot{flex:1;position:relative;overflow:hidden}
.app{position:absolute;inset:0}

/* ---------- 屏幕切换 ---------- */
.scr{position:absolute;inset:0;display:none;flex-direction:column}
.scr.on{display:flex}

/* ---------- 通用 ---------- */
.topbar{flex:none;display:flex;align-items:center;height:58px;padding:0 6px}
.topbar h1{font-size:26px;font-weight:700;letter-spacing:-.04em;line-height:1;margin-left:12px}
.icn{width:48px;height:48px;display:grid;place-items:center;border:0;background:none;color:var(--fg);border-radius:50%;cursor:pointer;padding:0}
.icn svg{width:21px;height:21px}
.icn.push{margin-left:auto}
.body{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 20px 30px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.list-head{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:600;margin:22px 0 12px}
.list-head .cnt{font:400 11px/1 var(--mono);color:var(--muted);letter-spacing:.1em}

/* ---------- 首页 · 搜索（内容区，不放头部） ---------- */
.search{display:flex;align-items:center;gap:9px;height:44px;margin-top:14px;padding:0 14px;border:1px solid var(--border);border-radius:13px;background:var(--surface);transition:border-color .16s ease,box-shadow .16s ease}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font:inherit;font-size:14px;color:var(--fg)}
.search input::placeholder{color:var(--muted)}

/* ---------- 首页 · 卡组行 ---------- */
.decks{list-style:none}
.deck{display:flex;align-items:center;gap:15px;padding:14px;margin-bottom:10px;border:1px solid var(--border);border-radius:16px;background:var(--surface);cursor:pointer}
.d-main{flex:1;min-width:0;display:flex;flex-direction:column}
.d-name{display:block;font-size:15px;font-weight:600;letter-spacing:-.02em}
.d-meta{display:block;margin-top:3px;font-size:12px;color:var(--muted)}

/* --- 卡堆语言（小尺寸）：与学习页同一构造 --- */
.mini{position:relative;width:32px;height:44px;flex:none}
.mini .m-back{
  position:absolute;right:6px;bottom:14px;width:15px;height:15px;
  border:1px solid var(--border);border-radius:4px;background:#FAFBFB;
  transform-origin:100% 100%;transform:rotate(-45deg);
}
.mini .m-card{
  position:absolute;left:0;top:0;width:24px;height:34px;
  border:1px solid var(--border);border-radius:6px;background:var(--surface);
  box-shadow:0 1px 2px rgba(16,19,20,.05);
}

/* ---------- 底部 Tab：仅 首页 / 我的 ---------- */
.tabbar{flex:none;display:flex;padding:8px 0 24px;border-top:1px solid var(--border);background:var(--surface)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;font:inherit;font-size:11px;letter-spacing:0;color:var(--muted);cursor:pointer}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--teal-deep);font-weight:600}

/* ---------- 卡片详情 ---------- */
.hero{display:flex;align-items:center;gap:16px;padding:8px 0 2px}
.hero-l{flex:1;min-width:0}
.hero h2{font-size:22px;font-weight:700;letter-spacing:-.04em;line-height:1.28}
.hero p{margin-top:7px;font-size:13px;color:var(--muted)}
.actions{display:flex;gap:10px;margin:20px 0 2px}
.btn{flex:1;height:48px;display:grid;place-items:center;border:0;border-radius:14px;font:inherit;font-size:15px;font-weight:600;letter-spacing:-.01em;cursor:pointer}
.btn.primary{background:var(--teal-deep);color:#fff}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid #D9DEDE}
.cards{list-style:none}
.crow{display:flex;align-items:center;gap:16px;height:60px;border-bottom:1px solid var(--border)}
.crow:last-child{border-bottom:0}
.c-l{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.c-f{font-size:16px;font-weight:500;letter-spacing:-.01em}
.c-r{font-size:11px;color:var(--muted);letter-spacing:.12em}
.c-b{font-size:13px;color:var(--muted);text-align:right;max-width:44%}
.fab{position:absolute;right:18px;bottom:28px;width:56px;height:56px;border:0;border-radius:18px;background:var(--teal-deep);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 24px rgba(10,115,115,.30);z-index:20}
.fab svg{width:22px;height:22px}

/* ---------- 添加卡片弹窗（头尾固定，中段滚动） ---------- */
.sheet{position:absolute;inset:0;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s ease}
.sheet.on{opacity:1;pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(12,15,16,.42)}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:86%;display:flex;flex-direction:column;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:0 -12px 44px rgba(0,0,0,.20)}
.p-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:20px 12px 12px 20px}
.p-head h2{font-size:17px;font-weight:700;letter-spacing:-.03em}
.p-body{flex:1;overflow-y:auto;padding:6px 20px 18px;display:flex;flex-direction:column;gap:16px;scrollbar-width:none}
.p-body::-webkit-scrollbar{display:none}
.p-foot{flex:none;display:flex;gap:10px;padding:14px 20px 22px;border-top:1px solid var(--border)}
.field{display:flex;flex-direction:column;gap:7px}
.field > span{font-size:12px;color:var(--muted)}
.field input{width:100%;height:44px;padding:0 14px;border:1px solid var(--border);border-radius:12px;background:#FBFCFC;font:inherit;font-size:15px;color:var(--fg);outline:none;transition:border-color .16s ease,background .16s ease,box-shadow .16s ease}
.field input:focus{border-color:var(--teal);background:var(--surface)}
.crow select{max-width:48%;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface);font:inherit;font-size:13px;color:var(--fg)}
.card-row-main{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;border:0;background:none;font:inherit;color:var(--fg);cursor:pointer}
.reorder{width:30px;height:36px;flex:none;border:1px solid var(--border);border-radius:8px;background:var(--surface);cursor:pointer}
.reorder:disabled{opacity:.3;cursor:default}
.btn:disabled{opacity:.55;cursor:default}
.field textarea{width:100%;min-height:88px;padding:11px 14px;border:1px solid var(--border);border-radius:12px;background:#FBFCFC;font:inherit;font-size:15px;color:var(--fg);resize:vertical}
.field textarea:focus{outline:none;border-color:var(--teal);background:var(--surface)}

/* ---------- 学习 ---------- */
.mode-btn{
  display:inline-flex;align-items:center;gap:7px;margin-left:8px;
  height:48px;padding:0 6px;border:0;background:none;
  font:inherit;font-size:15px;font-weight:600;letter-spacing:-.02em;color:var(--fg);
  cursor:pointer;border-radius:12px;
}
.mode-btn svg{width:14px;height:14px;color:var(--muted);flex:none}
.live{display:none;width:6px;height:6px;border-radius:50%;background:var(--teal);flex:none}
.scr.auto .live{display:block;animation:live 1.5s ease-in-out infinite}
@keyframes live{0%,100%{opacity:.22;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}

.counter{margin-left:auto;margin-right:12px;font:500 12px/1 var(--mono);letter-spacing:.16em;color:var(--muted)}
.counter b{color:var(--fg);font-weight:500}

.study-body{flex:1;display:grid;place-items:center;padding:0 26px 100px}
.stack{position:relative;width:100%;height:400px}

.behind{
  position:absolute;right:6px;bottom:6px;width:110px;height:110px;
  border:1px solid var(--border);border-radius:14px;background:#FAFBFB;
  transform-origin:100% 100%;transform:rotate(-45deg);z-index:1;
}

.card{position:absolute;inset:0;z-index:3;border:1px solid var(--border);border-radius:22px;background:var(--surface);box-shadow:0 14px 34px rgba(16,19,20,.08);overflow:hidden;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
.card-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:40px 32px 104px;transition:opacity .16s ease}
.card-face.back{opacity:0}
.card.flipped .card-face.front{opacity:0}
.card.flipped .card-face.back{opacity:1}
.card-face .w{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.2;text-align:center}
.card-face .r{font-size:17px;color:var(--muted);letter-spacing:0;line-height:1.65;text-align:center}
.card-face.back .w{font-size:24px}

.audio{
  position:absolute;left:50%;bottom:24px;transform:translateX(-50%);
  width:48px;height:48px;display:grid;place-items:center;
  border:1px solid #D9DEDE;border-radius:50%;background:var(--surface);color:var(--fg);
  cursor:pointer;
}
.audio svg.ico{width:19px;height:19px}
.audio .bars{display:none;align-items:flex-end;gap:2.5px;height:14px}
.audio .bars i{width:2.5px;height:5px;border-radius:2px;background:currentColor;animation:wave .9s ease-in-out infinite}
.audio .bars i:nth-child(2){animation-delay:.15s}
.audio .bars i:nth-child(3){animation-delay:.3s}
.audio.playing svg.ico{display:none}
.audio.playing .bars{display:flex}
.scr.auto .audio{border-color:#CFE4E4;background:#EFF6F6;color:var(--teal-deep)}
@keyframes wave{0%,100%{height:5px}50%{height:14px}}

/* 切方式 = 卡堆重新发牌 */
.stack.dealing .card{animation:reDeal .44s cubic-bezier(.34,1.4,.5,1)}
.stack.dealing .behind{animation:nudge .44s cubic-bezier(.34,1.4,.5,1)}
@keyframes reDeal{0%{transform:translateY(0)}45%{transform:translateY(10px)}100%{transform:translateY(0)}}
@keyframes nudge{0%{transform:rotate(-45deg) scale(1)}45%{transform:rotate(-45deg) scale(1.035)}100%{transform:rotate(-45deg) scale(1)}}

/* ============================================================
   按压反馈 —— 液态玻璃
   ------------------------------------------------------------
   上一版两个硬伤，这版都根治：
   1) 一条 position:relative 把 .fab 与 .audio 从 absolute 打回
      文档流 —— 悬浮加号掉进列表、发音键被 left:50% 推飞。
      这版只给「本来就是 relative」的控件补上下文，两个绝对定位
      控件排除在外。
   2) 玻璃层只有白色高光 —— 铺在白卡上等于白铺白，全隐形。
      这版高光与暗角同时给：左上打白反光，右下压冷暗角，
      明暗一夹，白底上才有「一层玻璃浮起来」的厚度。
   按下 90ms 到位（快），松手 340ms 弹簧回位带过冲（慢）。
   分层：主按钮 / FAB / 复习卡明显；图标键与底部 Tab 只留掠光。
   ============================================================ */

/* 只给本来就是 relative 的控件补定位上下文。
   .fab 与 .audio 已经是 absolute —— 绝不在此列。 */
.icn,.tab,.btn,.deck,.mode-btn{position:relative}

.icn,.tab,.btn,.fab,.deck,.audio,.mode-btn{
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  transition:
    transform .34s cubic-bezier(.34,1.62,.44,1),
    box-shadow .34s cubic-bezier(.34,1.62,.44,1),
    background-color .22s ease,
    border-color .22s ease,
    color .22s ease,
    opacity .22s ease;
}

/* —— 玻璃层：休息时透明且缩小，按下时铺满 —— */
.icn::after,.tab::after,.btn::after,.fab::after,.deck::after,
.audio::after,.mode-btn::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  opacity:0;z-index:1;
  background:
    radial-gradient(132% 104% at 12% -10%,
      rgba(255,255,255,.98) 0%,
      rgba(255,255,255,.44) 18%,
      rgba(255,255,255,0) 46%),
    linear-gradient(324deg,
      rgba(16,19,20,.13) 0%,
      rgba(16,19,20,0) 43%);
  transform:scale(.86);
  transition:opacity .34s cubic-bezier(.22,.61,.36,1),
             transform .34s cubic-bezier(.34,1.6,.44,1);
}

/* —— 明显档：两个学习按钮、悬浮加号、首页复习卡 —— */
.btn:active,.fab:active{
  transition-duration:.09s;
  transition-timing-function:cubic-bezier(.22,.61,.36,1);
}
.btn:active{transform:scale(1.024,.962)}
.btn.primary:active{
  background:#0B6E6E;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.92),
             inset 0 -3px 8px rgba(0,0,0,.22),
             0 2px 8px rgba(10,115,115,.20);
}
.btn.ghost:active{
  background:#F3FAFA;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,1),
             inset 0 -2.5px 7px rgba(16,19,20,.14),
             inset 0 0 0 1px rgba(16,19,20,.04);
}
.fab:active{
  transform:scale(.946);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.88),
             inset 0 -3px 9px rgba(0,0,0,.26),
             0 2px 8px rgba(10,115,115,.22);
}
.btn:active::after,.fab:active::after{
  opacity:1;transform:scale(1);transition-duration:.09s;
}

/* —— 极轻档：图标键、底部 Tab、卡组行、下拉、方式按钮、发音键 —— */
.icn:active,.tab:active,.deck:active,.mode-btn:active,.audio:active{
  transition-duration:.09s;
  transition-timing-function:cubic-bezier(.22,.61,.36,1);
}
.icn:active{
  background:rgba(16,19,20,.055);
  transform:scale(.94);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.9),inset 0 -2px 5px rgba(16,19,20,.10);
}
.tab:active{
  color:var(--fg);
  transform:scale(.94);
}
.deck:active{
  background:#F3F9F9;border-color:#D5DCDC;
  transform:scale(.992);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,1),inset 0 -2px 6px rgba(16,19,20,.11);
}
.mode-btn:active{opacity:.66;transform:scale(.97)}
.audio:active{
  transform:translateX(-50%) scale(.94);
  border-color:#CFE4E4;background:#F1F8F8;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,1),inset 0 -2px 6px rgba(16,19,20,.13);
}
.icn:active::after,.deck:active::after,
.audio:active::after{
  opacity:.66;transform:scale(1);transition-duration:.09s;
}
.tab:active::after,.mode-btn:active::after{
  opacity:.44;transform:scale(1);transition-duration:.09s;
}

/* 输入框走焦点环，不给玻璃 */
.search:focus-within{border-color:var(--teal);background:var(--surface);box-shadow:0 0 0 3px rgba(14,154,154,.10)}
.field input:focus{box-shadow:0 0 0 3px rgba(14,154,154,.10)}
.study-status{position:absolute;left:24px;right:24px;bottom:104px;text-align:center;color:var(--muted);font-size:13px;min-height:20px}
.study-nav{position:absolute;left:20px;right:20px;bottom:143px;display:flex;justify-content:space-between;gap:12px}
.study-nav button{padding:5px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);font:inherit;font-size:12px;color:var(--muted);cursor:pointer}
.study-controls{position:absolute;left:20px;right:20px;bottom:34px;display:flex;gap:8px}
.study-controls .btn{height:44px;font-size:13px}
.demo-note{font-size:11px;color:var(--muted);line-height:1.5}
.empty-note{padding:22px 8px;color:var(--muted);font-size:13px;text-align:center}

@media (max-width:900px){body{padding:28px 16px 56px}}

@media (prefers-reduced-motion:reduce){
  .scr.auto .live{animation:none;opacity:.9}
  .stack.dealing .card,.stack.dealing .behind{animation:none}
  .audio .bars i{animation:none}
  .icn::after,.tab::after,.btn::after,.fab::after,.deck::after,
  .audio::after,.mode-btn::after{
    transform:none;transition:opacity .12s linear;
  }
  .btn:active,.fab:active,
  .icn:active,.tab:active,.deck:active,.sel:active,.mode-btn:active{transform:none}
  .audio:active{transform:translateX(-50%)}
}
</style>
</head>
<body>

<header class="board-head">
  <h1>知声卡</h1><span>EchoCards · Android 功能原型（语音为模拟）</span>
</header>

<main class="board">

  <figure class="device" data-start="home">
    <div class="phone">
      <div class="screen">
        <div class="punch"></div>
        <div class="statusbar">
          <span class="sb-time">9:41</span>
          <span class="sb-icons">
            <svg viewBox="0 0 18 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1.6 4.3a11 11 0 0 1 14.8 0"/><path d="M4.7 7.1a6.6 6.6 0 0 1 8.6 0"/><circle cx="9" cy="10" r="1.05" fill="currentColor" stroke="none"/></svg>
            <svg viewBox="0 0 16 12"><path d="M1 8.6h2.6v3.4H1zM5.6 5.8h2.6v6.2H5.6zM10.2 3h2.6v9h-2.6zM14.4 0h1.6v12h-1.6z" fill="currentColor"/></svg>
            <svg viewBox="0 0 24 12"><rect x="1" y="1.4" width="19" height="9.2" rx="3" fill="none" stroke="currentColor" stroke-opacity=".4" stroke-width="1.4"/><rect x="3" y="3.4" width="14" height="5.2" rx="1.6" fill="currentColor"/><path d="M21.6 4.4v3.2a2 2 0 0 0 0-3.2z" fill="currentColor" fill-opacity=".4"/></svg>
          </span>
        </div>
        <div class="app-slot"></div>
        <div class="gesture"></div>
      </div>
    </div>
    <figcaption>首页</figcaption>
  </figure>

  <figure class="device" data-start="detail">
    <div class="phone">
      <div class="screen">

<script>
(function () {
  var CARDS = [
    { title: '惯性', content: '物体保持原来运动状态不变的性质叫作惯性。', speechText: '', memoryTip: '不受力，就保持原来的状态。' },
    { title: '牛顿第一定律', content: '一切物体在没有受到外力作用时，总保持静止状态或匀速直线运动状态。', speechText: '', memoryTip: '没有外力，运动状态不改变。' },
    { title: '力的作用', content: '力可以改变物体的运动状态，也可以使物体发生形变。', speechText: '', memoryTip: '' }
  ];

  var MODES = [
    { name: '手动学习' },
    { name: '自动跟读' },
    { name: '自动播放' }
  ];

  var DEMO_AUDIO_MS = 1450;

  var tpl = document.getElementById('app-tpl');

  Array.prototype.forEach.call(document.querySelectorAll('.device'), function (dev) {
    var slot = dev.querySelector('.app-slot');
    slot.appendChild(tpl.content.cloneNode(true));
    initApp(slot, dev.getAttribute('data-start') || 'home');
  });

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function initApp(root, start) {

    var studyScr  = root.querySelector('[data-scr="study"]');
    var stack     = root.querySelector('[data-stack]');
    var card      = root.querySelector('[data-card]');
    var frontW    = root.querySelector('[data-front-w]');
    var frontR    = root.querySelector('[data-front-r]');
    var backW     = root.querySelector('[data-back-w]');
    var backR     = root.querySelector('[data-back-r]');
    var count     = root.querySelector('[data-count]');
    var total     = root.querySelector('[data-total]');
    var audio     = root.querySelector('.audio');
    var modeBtn   = root.querySelector('[data-mode-toggle]');
    var modeLabel = root.querySelector('[data-mode-label]');
    var status    = root.querySelector('[data-status]');
    var controls  = root.querySelector('[data-controls]');
    var pauseBtn  = root.querySelector('[data-pause]');
    var replayBtn = root.querySelector('[data-replay]');
    var skipBtn   = root.querySelector('[data-skip]');
    var completeBtn = root.querySelector('[data-complete]');
    var speedBtn = root.querySelector('[data-speed]');
    var modeSheet = root.querySelector('[data-mode-sheet]');
    var modeOpen  = root.querySelector('[data-mode-open]');
    var search    = root.querySelector('.search input');
    var deckList = root.querySelector('[data-deck-list]');
    var cardList = root.querySelector('[data-card-list]');
    var settings  = {
      defaultMode: root.querySelector('[data-default-mode]'),
      speechRate: root.querySelector('[data-speech-rate]'),
      delay: root.querySelector('[data-advance-delay]')
    };

    var decks = [{ title: '初中物理知识点', description: '', cards: CARDS.map(function (item) { return Object.assign({}, item); }), idx: 2 }];
    var currentDeck = decks[0];
    var cards = currentDeck.cards;
    var idx = currentDeck.idx;
    var mode = 0;
    var paused = false;
    var phase = 'ready';
    var coverage = 0;
    var resumeAfterModeClose = false;
    var token = 0;
    var timers = [];
    var editingCard = null;
    var drag = { on: false, sx: 0, sy: 0, dx: 0, moved: false, t0: 0 };

    function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
    function stopTasks() {
      token += 1;
      timers.forEach(clearTimeout);
      timers = [];
      audio.classList.remove('playing');
      studyScr.classList.remove('auto');
    }
    function setStatus(message) { status.textContent = message; }

    function playAudio() {
      if (!cards.length) return;
      audio.classList.add('playing');
      phase = 'speaking';
      setStatus('正在朗读（原型演示）');
      var current = token;
      later(function () {
        if (current !== token) return;
        audio.classList.remove('playing');
        if (mode === 1) {
          phase = 'listening';
          setStatus('轮到你读了 · 跟读进度 0%（模拟）');
          paint();
        } else if (mode === 2) {
          showTipAndAdvance();
        } else {
          phase = 'ready';
          setStatus('朗读完成 · 点击卡片查看快速记忆点');
        }
      }, DEMO_AUDIO_MS / Number(settings.speechRate.value));
    }

    function paint() {
      var c = cards[idx];
      if (!c) return;
      frontW.textContent = c.title;
      frontR.textContent = c.content;
      backW.textContent  = '快速记忆点';
      backR.textContent  = c.memoryTip || '暂无快速记忆点';
      count.textContent = pad2(idx + 1);
      total.textContent = cards.length;
      modeLabel.textContent = MODES[mode].name;
      studyScr.classList.toggle('auto', mode !== 0 && !paused);
      audio.style.display = mode === 0 ? '' : 'none';
      controls.style.display = mode === 0 ? 'none' : 'flex';
      replayBtn.style.display = mode === 1 ? '' : 'none';
      skipBtn.style.display = mode === 1 ? '' : 'none';
      speedBtn.style.display = mode === 2 ? '' : 'none';
      speedBtn.textContent = '速度 ' + Number(settings.speechRate.value).toFixed(1) + '×';
      completeBtn.style.display = mode === 1 && phase === 'listening' ? '' : 'none';
      pauseBtn.textContent = paused ? '继续' : '暂停';
    }

    function runAuto() {
      if (mode === 0 || paused || !cards.length) return;
      stopTasks();
      coverage = 0;
      studyScr.classList.add('auto');
      card.classList.remove('flipped');
      playAudio();
    }

    function showTipAndAdvance() {
      if (paused) return;
      phase = 'tip';
      card.classList.add('flipped');
      setStatus('快速记忆点');
      paint();
      var current = token;
      later(function () {
        if (current === token && studyScr.classList.contains('on')) move(1, true);
      }, Number(settings.delay.value));
    }

    function move(direction, fromAuto) {
      if (!cards.length) return;
      stopTasks();
      phase = 'ready';
      var distance = direction > 0 ? -460 : 460;
      card.style.transition = 'transform .28s ease, opacity .28s ease';
      card.style.transform = 'translateX(' + distance + 'px) rotate(' + (direction > 0 ? -8 : 8) + 'deg)';
      card.style.opacity = '0';

      later(function () {
        idx = (idx + direction + cards.length) % cards.length;
        currentDeck.idx = idx;
        paint();
        card.classList.remove('flipped');
        card.style.transition = 'none';
        card.style.transform = 'translateX(' + (-distance / 8) + 'px) scale(.975)';
        card.style.opacity = '0';
        requestAnimationFrame(function () {
          card.style.transition = 'transform .28s ease, opacity .28s ease';
          card.style.transform = 'none';
          card.style.opacity = '1';
          setStatus('点击卡片查看快速记忆点 · 左滑下一张 / 右滑上一张');
          if ((fromAuto || mode !== 0) && !paused) later(runAuto, 320);
        });
        renderCards();
      }, 280);
    }

    function reDeal() {
      stack.classList.remove('dealing');
      void stack.offsetWidth;
      stack.classList.add('dealing');
      setTimeout(function () { stack.classList.remove('dealing'); }, 480);
    }

    function setMode(target, animated) {
      target = ((target % MODES.length) + MODES.length) % MODES.length;
      var changed = target !== mode;
      stopTasks();
      mode = target;
      paused = false;
      phase = 'ready';
      coverage = 0;
      paint();
      card.classList.remove('flipped');
      if (animated && changed) reDeal();
      setStatus(mode === 1 ? '自动跟读演示：朗读后点击“跟读 +25%”' :
        mode === 2 ? '自动播放演示：朗读后翻面并循环' :
        '点击卡片查看快速记忆点 · 左滑下一张 / 右滑上一张');
      if (mode !== 0 && studyScr.classList.contains('on')) runAuto();
    }

    function openModeSheet() {
      var selected = studyScr.classList.contains('on') ? mode : Number(settings.defaultMode.value);
      resumeAfterModeClose = studyScr.classList.contains('on') && mode !== 0 && !paused;
      if (studyScr.classList.contains('on')) {
        stopTasks();
        if (resumeAfterModeClose) {
          paused = true;
          phase = 'paused';
          setStatus('已暂停 · 选择学习方式');
          paint();
        }
      }
      Array.prototype.forEach.call(root.querySelectorAll('[data-mode-choice]'), function (el) {
        el.classList.toggle('primary', Number(el.getAttribute('data-mode-choice')) === selected);
        el.classList.toggle('ghost', Number(el.getAttribute('data-mode-choice')) !== selected);
      });
      modeSheet.classList.add('on');
    }
    modeBtn.addEventListener('click', openModeSheet);

    function resetCard() {
      card.style.transition = 'transform .30s cubic-bezier(.2,.8,.2,1), opacity .30s ease';
      card.style.transform = 'none';
      card.style.opacity = '1';
    }

    card.addEventListener('pointerdown', function (e) {
      if (e.target.closest('.audio')) return;
      drag.on = true; drag.moved = false;
      drag.sx = e.clientX; drag.sy = e.clientY; drag.dx = 0;
      drag.t0 = Date.now();
      card.style.transition = 'none';
      try { card.setPointerCapture(e.pointerId); } catch (_) {}
    });

    card.addEventListener('pointermove', function (e) {
      if (!drag.on) return;
      drag.dx = e.clientX - drag.sx;
      drag.moved = drag.moved || Math.abs(drag.dx) > 7 || Math.abs(e.clientY - drag.sy) > 7;
      card.style.transform = 'translateX(' + drag.dx + 'px) rotate(' + Math.max(-9, Math.min(9, drag.dx * 0.028)) + 'deg)';
      card.style.opacity = Math.max(0.4, 1 - Math.abs(drag.dx) / 520).toFixed(3);
    });

    function release() {
      if (!drag.on) return;
      drag.on = false;
      if (!drag.moved && Date.now() - drag.t0 < 350) {
        card.classList.toggle('flipped');
        resetCard();
        return;
      }
      if (drag.dx < -90) move(1, false);
      else if (drag.dx > 90) move(-1, false);
      else resetCard();
      drag.dx = 0;
    }

    card.addEventListener('pointerup', release);
    window.addEventListener('pointerup', release);
    window.addEventListener('pointercancel', release);
    window.addEventListener('blur', release);
    card.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft') { e.preventDefault(); move(1, false); }
      if (e.key === 'ArrowRight') { e.preventDefault(); move(-1, false); }
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); card.classList.toggle('flipped'); }
    });
    root.querySelector('[data-previous]').addEventListener('click', function () { move(-1, false); });
    root.querySelector('[data-next]').addEventListener('click', function () { move(1, false); });

    audio.addEventListener('click', function (e) {
      e.stopPropagation();
      if (mode !== 0) return;
      if (phase === 'speaking') {
        stopTasks();
        phase = 'paused';
        setStatus('朗读已暂停 · 再次点击继续');
      } else {
        stopTasks();
        playAudio();
      }
    });

    pauseBtn.addEventListener('click', function () {
      paused = !paused;
      stopTasks();
      if (paused) {
        phase = 'paused';
        setStatus('已暂停 · 点击继续重新朗读当前卡片');
      } else {
        runAuto();
      }
      paint();
    });
    replayBtn.addEventListener('click', function () { paused = false; runAuto(); paint(); });
    skipBtn.addEventListener('click', function () { move(1, false); });
    speedBtn.addEventListener('click', function () {
      var rates = ['0.8', '1', '1.2', '1.5'];
      settings.speechRate.value = rates[(rates.indexOf(settings.speechRate.value) + 1) % rates.length];
      paint();
    });
    completeBtn.addEventListener('click', function () {
      if (mode !== 1 || phase !== 'listening') return;
      coverage = Math.min(100, coverage + 25);
      setStatus('跟读进度 ' + coverage + '%（模拟）');
      if (coverage === 100) {
        phase = 'complete';
        paint();
        later(showTipAndAdvance, 320);
      }
    });

    var screens = Array.prototype.slice.call(root.querySelectorAll('.scr'));
    function show(name) {
      var wasStudy = studyScr.classList.contains('on');
      screens.forEach(function (s) {
        s.classList.toggle('on', s.getAttribute('data-scr') === name);
      });
      if (name === 'study') {
        if (!wasStudy && mode !== 0 && !paused) runAuto();
      } else {
        stopTasks();
        resetCard();
        if (name === 'detail') renderCards();
      }
    }

    Array.prototype.forEach.call(root.querySelectorAll('[data-go]'), function (el) {
      el.addEventListener('click', function () {
        show(el.getAttribute('data-go'));
      });
    });

    var sheet = root.querySelector('[data-sheet]');
    var deckSheet = root.querySelector('[data-deck-sheet]');
    var deckForm = {
      title: root.querySelector('[data-deck-title]'),
      description: root.querySelector('[data-deck-description]'),
      deleteButton: root.querySelector('[data-deck-delete]')
    };
    var cardForm = {
      title: root.querySelector('[data-card-title]'),
      content: root.querySelector('[data-card-content]'),
      speechText: root.querySelector('[data-card-speech]'),
      memoryTip: root.querySelector('[data-card-tip]'),
      deleteButton: root.querySelector('[data-card-delete]')
    };
    var editingDeck = null;

    function renderDecks() {
      deckList.replaceChildren();
      var query = search.value.trim().toLocaleLowerCase('zh-CN');
      var visible = decks.filter(function (d) { return d.title.toLocaleLowerCase('zh-CN').includes(query); });
      visible.forEach(function (deck) {
        var row = document.createElement('li');
        row.className = 'deck';
        row.tabIndex = 0;
        var name = document.createElement('span');
        name.className = 'd-main';
        var title = document.createElement('span');
        title.className = 'd-name';
        title.textContent = deck.title;
        var meta = document.createElement('span');
        meta.className = 'd-meta';
        meta.textContent = deck.cards.length + ' 张 · ' + (deck.cards.length ? '上次学到第 ' + (deck.idx + 1) + ' 张' : '尚未开始');
        name.append(title, meta);
        row.append(name);
        row.addEventListener('click', function () { openDeck(deck); });
        row.addEventListener('keydown', function (e) { if (e.key === 'Enter') openDeck(deck); });
        deckList.append(row);
      });
      var empty = root.querySelector('[data-search-empty]');
      empty.hidden = visible.length !== 0;
      empty.textContent = decks.length ? '没有找到匹配的卡组' : '还没有卡组，创建第一个卡组';
    }

    function renderCards() {
      cardList.replaceChildren();
      root.querySelector('[data-card-count]').textContent = cards.length;
      root.querySelector('[data-card-empty]').hidden = cards.length !== 0;
      modeOpen.textContent = cards.length ? '开始学习' : '添加第一张卡片';
      cards.forEach(function (item, position) {
        var row = document.createElement('li');
        row.className = 'crow';
        var main = document.createElement('button');
        main.className = 'card-row-main';
        main.type = 'button';
        main.textContent = item.title + ' · ' + item.content;
        main.addEventListener('click', function () { openCardForm(position); });
        var up = document.createElement('button');
        up.className = 'reorder';
        up.type = 'button';
        up.setAttribute('aria-label', '上移 ' + item.title);
        up.textContent = '↑';
        up.disabled = position === 0;
        up.addEventListener('click', function () {
          var previous = cards[position - 1];
          cards[position - 1] = cards[position];
          cards[position] = previous;
          if (idx === position) idx -= 1;
          else if (idx === position - 1) idx += 1;
          currentDeck.idx = idx;
          renderCards();
          paint();
        });
        var down = document.createElement('button');
        down.className = 'reorder';
        down.type = 'button';
        down.setAttribute('aria-label', '下移 ' + item.title);
        down.textContent = '↓';
        down.disabled = position === cards.length - 1;
        down.addEventListener('click', function () {
          var next = cards[position + 1];
          cards[position + 1] = cards[position];
          cards[position] = next;
          if (idx === position) idx += 1;
          else if (idx === position + 1) idx -= 1;
          currentDeck.idx = idx;
          renderCards();
          paint();
        });
        row.append(main, up, down);
        cardList.append(row);
      });
      root.querySelector('[data-deck-meta]').textContent = cards.length + ' 张卡片 · ' +
        (cards.length ? '上次学到第 ' + (idx + 1) + ' 张' : '尚未开始');
      renderDecks();
    }

    function openDeck(deck) {
      currentDeck = deck;
      cards = deck.cards;
      idx = Math.max(0, Math.min(deck.idx, cards.length - 1));
      root.querySelector('.hero h2').textContent = deck.title;
      var description = root.querySelector('[data-deck-description]');
      description.textContent = deck.description;
      description.hidden = !deck.description;
      renderCards();
      if (cards.length) paint();
      show('detail');
    }

    function openCardForm(position) {
      editingCard = position;
      var item = position === null ? { title: '', content: '', speechText: '', memoryTip: '' } : cards[position];
      root.querySelector('[data-card-form-title]').textContent = position === null ? '添加卡片' : '编辑卡片';
      cardForm.title.value = item.title;
      cardForm.content.value = item.content;
      cardForm.speechText.value = item.speechText;
      cardForm.memoryTip.value = item.memoryTip;
      cardForm.deleteButton.hidden = position === null;
      sheet.classList.add('on');
    }

    root.querySelector('[data-fab]').addEventListener('click', function () { openCardForm(null); });
    Array.prototype.forEach.call(root.querySelectorAll('[data-close]'), function (el) {
      el.addEventListener('click', function () { sheet.classList.remove('on'); });
    });
    root.querySelector('[data-card-save]').addEventListener('click', function () {
      var title = cardForm.title.value.trim();
      var content = cardForm.content.value.trim();
      if (!title || !content) { alert('标题和正文不能为空'); return; }
      var item = { title: title, content: content, speechText: cardForm.speechText.value.trim(), memoryTip: cardForm.memoryTip.value.trim() };
      if (editingCard === null) cards.push(item); else cards[editingCard] = item;
      sheet.classList.remove('on');
      renderCards();
      paint();
    });
    cardForm.deleteButton.addEventListener('click', function () {
      if (editingCard === null || !confirm('确定删除这张卡片吗？')) return;
      cards.splice(editingCard, 1);
      if (editingCard < idx) idx -= 1;
      idx = Math.max(0, Math.min(idx, cards.length - 1));
      currentDeck.idx = idx;
      sheet.classList.remove('on');
      renderCards();
      if (cards.length) paint();
    });

    function openDeckForm(deck) {
      editingDeck = deck;
      root.querySelector('[data-deck-form-title]').textContent = deck ? '编辑卡组' : '创建卡组';
      deckForm.title.value = deck ? deck.title : '';
      deckForm.description.value = deck ? deck.description : '';
      deckForm.deleteButton.hidden = !deck;
      deckSheet.classList.add('on');
    }
    root.querySelector('[data-deck-create]').addEventListener('click', function () { openDeckForm(null); });
    root.querySelector('[data-deck-edit]').addEventListener('click', function () { openDeckForm(currentDeck); });
    Array.prototype.forEach.call(root.querySelectorAll('[data-deck-close]'), function (el) {
      el.addEventListener('click', function () { deckSheet.classList.remove('on'); });
    });
    root.querySelector('[data-deck-save]').addEventListener('click', function () {
      var title = deckForm.title.value.trim();
      if (!title) { alert('卡组名称不能为空'); return; }
      if (editingDeck) {
        editingDeck.title = title;
        editingDeck.description = deckForm.description.value.trim();
        root.querySelector('.hero h2').textContent = title;
        root.querySelector('[data-deck-description]').textContent = editingDeck.description;
        root.querySelector('[data-deck-description]').hidden = !editingDeck.description;
      } else {
        decks.push({ title: title, description: deckForm.description.value.trim(), cards: [], idx: 0 });
      }
      deckSheet.classList.remove('on');
      renderDecks();
    });
    deckForm.deleteButton.addEventListener('click', function () {
      if (!editingDeck || !confirm('确定删除卡组及其中全部卡片吗？')) return;
      decks.splice(decks.indexOf(editingDeck), 1);
      deckSheet.classList.remove('on');
      renderDecks();
      show('home');
    });

    search.addEventListener('input', renderDecks);
    modeOpen.addEventListener('click', function () {
      if (cards.length) openModeSheet(); else openCardForm(null);
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-mode-close]'), function (el) {
      el.addEventListener('click', function () {
        modeSheet.classList.remove('on');
        if (resumeAfterModeClose) {
          paused = false;
          runAuto();
          paint();
        }
        resumeAfterModeClose = false;
      });
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-mode-choice]'), function (el) {
      el.addEventListener('click', function () {
        modeSheet.classList.remove('on');
        resumeAfterModeClose = false;
        setMode(Number(el.getAttribute('data-mode-choice')), true);
        if (!studyScr.classList.contains('on')) show('study');
      });
    });

    renderDecks();
    renderCards();
    paint();
    setMode(Number(settings.defaultMode.value), false);
    show(start);
  }
})();
</script>
</body>
</html>
