name: EchoCards

options:
  minimumXcodeGenVersion: 2.46.0
  bundleIdPrefix: com.orange
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

targets:
  EchoCards:
    type: application
    platform: macOS

    sources:
      - path: Sources/EchoCardsMacApp
      - path: Resources
        buildPhase: resources

    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: 知声卡
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        NSHighResolutionCapable: true

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orange.echocards.mac
        PRODUCT_MODULE_NAME: EchoCardsMacApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic

    dependencies:
      - sdk: libsqlite3.tbd
    scheme:
      testTargets:
        - EchoCardsTests
  EchoCardsTests:
    type: bundle.unit-test
    platform: macOS

    sources:
      - path: Tests/EchoCardsMacAppTests

    dependencies:
      - target: EchoCards

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orange.echocards.mac.tests
        SWIFT_VERSION: "6.0"
