      .settings-menu button{padding:8px 10px;font-size:12px}
      .settings-menu button.active{background:color-mix(in oklab,var(--accent),white 90%)}

      .setting-row{min-height:50px;padding:9px 13px;gap:14px;border-bottom-color:var(--border-soft)}

      .setting-copy small{font-size:11px;line-height:1.35;margin-top:2px}

      .nav{padding-inline:7px}
      .nav button{padding-inline:7px;gap:7px;font-size:12px}
      .sidebar-label{padding-inline:13px}
      .deck-shortcuts{padding-inline:7px}
      .deck-shortcuts button{padding-inline:7px}
      .sidebar-footer{padding-inline:7px}
      .sidebar-footer button{padding-inline:7px}

      .nav button{justify-content:center;gap:0;font-size:0;padding-inline:0}
      .nav button .icon{width:18px;height:18px}
      .brand > span:last-child{display:none}
      .sidebar-footer button{justify-content:center;gap:0;font-size:0;padding-inline:0}
      .sidebar-footer button .icon{width:18px;height:18px}
      @media(max-width:900px){.window{grid-template-columns:176px 1fr}}
    </style>

  <script>

  <script>
    const decks=[{title:'产品设计原则',description:'用于日常评审的产品与交互设计原则。',progress:72,cards:[{title:'让目标先被看见',content:'页面的目标、主要内容和关键操作应当在第一眼就建立清晰层级。',memoryTip:'先目标，后路径，再细节。'},{title:'反馈必须及时',content:'用户完成操作后，应立刻获得成功、失败或进行中的明确反馈。',memoryTip:'每个动作都要有回声。'},{title:'减少认知切换',content:'将同一任务的信息与操作放在相邻位置，避免在多个页面间反复跳转。',memoryTip:'上下文要连续。'},{title:'可逆操作优先',content:'普通操作应尽量可撤销；不可逆操作必须有清晰确认。',memoryTip:'先给退路，再谈效率。'},{title:'保持一致',content:'同类组件、语言和交互模式应保持一致，让经验能够迁移。',memoryTip:'学会一次，处处可用。'},{title:'照顾键盘用户',content:'桌面工具的关键路径需要完整的键盘可达与可见焦点。',memoryTip:'不碰鼠标也能完成。'}]},{title:'高频英语表达',description:'会议、沟通与产品协作中的常见英语表达。',progress:38,cards:[{title:'Align on',content:'达成一致；例：Let us align on the scope first.',memoryTip:'对齐目标或范围。'},{title:'Follow up',content:'跟进；例：I will follow up with the engineering team.',memoryTip:'事情之后继续推进。'},{title:'Trade-off',content:'权衡；例：There is a trade-off between speed and quality.',memoryTip:'无法同时最大化的选择。'},{title:'Edge case',content:'边缘情况；例：We should cover this edge case.',memoryTip:'少见但需要处理的情况。'},{title:'Roll out',content:'逐步发布；例：We will roll it out next week.',memoryTip:'从小范围走向全面。'},{title:'Blocker',content:'阻塞问题；例：Is there any blocker for launch?',memoryTip:'不解决就无法继续。'}]},{title:'认知心理学',description:'学习、记忆与注意力的基础概念。',progress:17,cards:[{title:'工作记忆',content:'人在短时间内加工信息的有限容量系统。',memoryTip:'容量有限，需要分组。'},{title:'间隔效应',content:'将学习分散在多个时间点，比集中学习更有利于长期记忆。',memoryTip:'分开学，记得久。'},{title:'提取练习',content:'主动回忆内容能够强化记忆线索，比重复阅读更有效。',memoryTip:'想出来胜过看一遍。'},{title:'认知负荷',content:'任务占用的心理资源总量，过高会妨碍理解与学习。',memoryTip:'降低无关负荷。'},{title:'双重编码',content:'同时使用语言和视觉表征能够增加记忆提取路径。',memoryTip:'文字加图像。'},{title:'首因效应',content:'序列开头的信息往往更容易被记住。',memoryTip:'开头最有优势。'}]}];
    const state={page:'overview',selected:0,studyDeck:0,studyCard:0,back:false,settings:{width:560,opacity:96,font:34,controls:true,drag:true,restore:true}};
    const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
    const icon=id=>`<svg class="icon"><use href="#${id}"/></svg>`;
    const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function deckCard(d,i){return `<button type="button" class="deck-card" data-deck="${i}"><div><div class="deck-top"><span class="deck-symbol">${icon('i-book')}</span>${state.studyDeck===i&&!$('#study-layer').hidden?'<span class="status">学习中</span>':''}</div><h3>${esc(d.title)}</h3><p class="od-clamp-2">${esc(d.description)}</p></div><div><div class="deck-meta"><span>${d.cards.length} 张卡片</span><span>${d.progress}%</span></div><div class="progress" aria-label="学习进度 ${d.progress}%"><i style="width:${d.progress}%"></i></div></div></button>`}
    function render(){const cards=decks.reduce((n,d)=>n+d.cards.length,0),avg=Math.round(decks.reduce((n,d)=>n+d.progress,0)/Math.max(1,decks.length));$('#nav-count').textContent=decks.length;$('#stat-decks').textContent=decks.length;$('#stat-cards').textContent=cards;$('#stat-progress').textContent=avg+'%';$('#library-summary').textContent=`${decks.length} 个卡组 · ${cards} 张卡片`;$('#recent-grid').innerHTML=decks.slice(0,2).map(deckCard).join('');$('#library-grid').innerHTML=decks.map(deckCard).join('');$$('[data-page]').forEach(b=>{b.type='button';b.classList.toggle('active',b.dataset.page===state.page);b.onclick=()=>go(b.dataset.page)});$$('.page').forEach(p=>p.classList.toggle('active',p.id==='page-'+state.page));const names={overview:'学习台',library:'卡组库',detail:'卡组详情',settings:'偏好设置'};$('#toolbar-title').textContent=names[state.page];if(state.page==='detail')renderDetail()}
    function renderDetail(){const d=decks[state.selected];if(!d){go('library');return}$('#detail-title').textContent=d.title;$('#detail-description').textContent=d.description;$('#detail-count').textContent=d.cards.length+' 张卡片';$('#detail-progress').textContent='本轮进度 '+d.progress+'%';$('#card-list').innerHTML=d.cards.map((c,i)=>`<button class="card-row" data-card="${i}"><span class="card-num">${String(i+1).padStart(2,'0')}</span><span><strong>${esc(c.title)}</strong><p class="od-truncate">${esc(c.content)}</p></span>${icon('i-chevron')}</button>`).join('')}
    function go(page){
      state.page=page;
      document.querySelectorAll('.page').forEach(section=>section.classList.toggle('active',section.id==='page-'+page));
      document.querySelectorAll('[data-page]').forEach(button=>button.classList.toggle('active',button.dataset.page===page));
      const names={overview:'学习台',library:'卡组库',detail:'卡组详情',settings:'偏好设置'};
      if($('#toolbar-title'))$('#toolbar-title').textContent=names[page]||'学习台';
      try{render()}catch(error){console.error('页面渲染失败',error)}
      if($('.content'))$('.content').scrollTop=0;
    }
    let lastFocus=null;
    function openDialog(html){lastFocus=document.activeElement;$('#dialog').innerHTML=html;$('#modal').hidden=false;requestAnimationFrame(()=>$('#dialog button,#dialog input')?.focus())}
    function closeDialog(){ $('#modal').hidden=true;lastFocus?.focus() }
    function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.hidden=true,2400)}
    function importDialog(){openDialog(`<h2 id="dialog-title">导入 JSON 卡组</h2><p>单个文件最多 2 MiB，支持 1–1000 张卡片。</p><div class="dropzone">${icon('i-file')}<strong>选择一个 JSON 文件</strong></div><div class="dialog-actions"><button class="btn" data-action="cancel">取消</button><button class="btn primary" data-action="choose-file">选择文件</button></div>`)}
    function editDialog(){const d=decks[state.selected];openDialog(`<h2 id="dialog-title">编辑卡组信息</h2><p>这些信息只用于整理和识别卡组。</p><label for="edit-title">卡组名称</label><input id="edit-title" type="text" value="${esc(d.title)}"><label for="edit-description">说明</label><input id="edit-description" type="text" value="${esc(d.description)}"><div class="error" id="edit-error" role="alert"></div><div class="dialog-actions"><button class="btn" data-action="cancel">取消</button><button class="btn primary" data-action="save-edit">保存更改</button></div>`)}
    function cardDialog(i){const c=decks[state.selected].cards[i];openDialog(`<h2 id="dialog-title">${esc(c.title)}</h2><p>${esc(c.content)}</p><div class="quick" style="margin:18px 0 0"><span class="quick-icon">${icon('i-layers')}</span><div class="quick-copy"><strong>快速记忆点</strong><span>${esc(c.memoryTip)}</span></div></div><div class="dialog-actions"><button class="btn primary" data-action="cancel">知道了</button></div>`)}
    function startStudy(deck=state.selected){state.studyDeck=deck;state.studyCard=0;state.back=false;$('#study-layer').hidden=false;renderStudy();render()}
    function renderStudy(){const d=decks[state.studyDeck],c=d.cards[state.studyCard];$('#float-deck').textContent=d.title;$('#face-label').textContent=state.back?'快速记忆点':'卡片正面';$('#float-heading').textContent=state.back?c.memoryTip:c.title;$('#float-copy').textContent=state.back?'':c.content;$('#position').textContent=`${state.studyCard+1} / ${d.cards.length}`;$('#floating-card').style.width=Math.min(state.settings.width,720)+'px';$('#floating-card').style.background=`rgba(255,255,255,${state.settings.opacity/100})`;$('#float-heading').style.fontSize=state.settings.font+'px';$('#float-controls').hidden=!state.settings.controls;$('#drag-handle').hidden=!state.settings.drag}
    function move(delta){const d=decks[state.studyDeck];state.studyCard=(state.studyCard+delta+d.cards.length)%d.cards.length;state.back=false;d.progress=Math.min(100,Math.max(d.progress,Math.round((state.studyCard+1)/d.cards.length*100)));renderStudy();render()}
    function action(name){if(name==='import')return importDialog();if(name==='cancel')return closeDialog();if(name==='choose-file')return $('#file-input').click();if(name==='resume')return startStudy(0);if(name==='study')return startStudy(state.selected);if(name==='close-study'){$('#study-layer').hidden=true;render();return}if(name==='prev')return move(-1);if(name==='next')return move(1);if(name==='edit')return editDialog();if(name==='save-edit'){const value=$('#edit-title').value.trim();if(!value){$('#edit-error').textContent='请输入卡组名称后再保存。';return}decks[state.selected].title=value;decks[state.selected].description=$('#edit-description').value.trim()||'暂无卡组说明';closeDialog();render();toast('卡组信息已更新');return}if(name==='delete'){const d=decks[state.selected];openDialog(`<h2 id="dialog-title">删除“${esc(d.title)}”？</h2><p>这个卡组和其中的 ${d.cards.length} 张卡片将从当前原型中移除。</p><div class="warning">此操作无法撤销，请确认不再需要该卡组。</div><div class="dialog-actions"><button class="btn" data-action="cancel">取消</button><button class="btn danger" data-action="confirm-delete">删除卡组</button></div>`);return}if(name==='confirm-delete'){decks.splice(state.selected,1);state.selected=Math.max(0,Math.min(state.selected,decks.length-1));closeDialog();go('library');toast('卡组已删除');return}if(name==='export'){const d=decks[state.selected],blob=new Blob([JSON.stringify({title:d.title,description:d.description,cards:d.cards},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=d.title+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);toast('已导出 JSON 文件');return}if(name==='reset'){state.settings={width:560,opacity:96,font:34,controls:true,drag:true,restore:true};$$('[data-setting]').forEach(el=>{const v=state.settings[el.dataset.setting];el.type==='checkbox'?el.checked=v:el.value=v});syncSettings();toast('已恢复默认窗口设置')}}
    function syncSettings(){for(const [k,v] of Object.entries(state.settings)){const out=$(`[data-output="${k}"]`);if(out)out.textContent=v+(k==='width'?' px':k==='font'?' pt':'%')}if(!$('#study-layer').hidden)renderStudy()}
    document.addEventListener('click',e=>{const page=e.target.closest('[data-page]'),deck=e.target.closest('[data-deck]'),act=e.target.closest('[data-action]'),card=e.target.closest('[data-card]');if(page)return go(page.dataset.page);if(deck){state.selected=+deck.dataset.deck;return go('detail')}if(act)return action(act.dataset.action);if(card)return cardDialog(+card.dataset.card)});
    $('#float-content').addEventListener('click',()=>{state.back=!state.back;renderStudy()});
    document.addEventListener('input',e=>{const k=e.target.dataset.setting;if(!k)return;state.settings[k]=e.target.type==='checkbox'?e.target.checked:+e.target.value;syncSettings()});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#modal').hidden)closeDialog();else if(!$('#study-layer').hidden)action('close-study');return}if($('#study-layer').hidden||!$('#modal').hidden||['INPUT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}if(e.key==='ArrowRight'){e.preventDefault();move(1)}if(e.code==='Space'){e.preventDefault();state.back=!state.back;renderStudy()}});
    $('#file-input').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2*1024*1024)throw Error('文件超过 2 MiB，请拆分后再导入');const data=JSON.parse(await file.text());if(typeof data.title!=='string'||!data.title.trim())throw Error('缺少有效的卡组名称');if(!Array.isArray(data.cards)||data.cards.length<1||data.cards.length>1000)throw Error('卡片数量必须在 1–1000 张之间');const cards=data.cards.map((c,i)=>{if(!c||typeof c.title!=='string'||!c.title.trim()||typeof c.content!=='string'||!c.content.trim())throw Error(`第 ${i+1} 张卡片缺少标题或正文`);return{title:c.title.trim(),content:c.content.trim(),memoryTip:typeof c.memoryTip==='string'&&c.memoryTip.trim()?c.memoryTip.trim():'暂无快速记忆点'}});decks.push({title:data.title.trim(),description:typeof data.description==='string'&&data.description.trim()?data.description.trim():'新导入的本地卡组',progress:0,cards});state.selected=decks.length-1;closeDialog();go('detail');toast(`已导入 ${cards.length} 张卡片`)}catch(err){closeDialog();toast('导入失败：'+err.message)}finally{e.target.value=''}});
    let drag=null;$('#drag-handle').addEventListener('pointerdown',e=>{if(!state.settings.drag)return;drag={x:e.clientX,y:e.clientY};e.target.setPointerCapture(e.pointerId)});$('#drag-handle').addEventListener('pointermove',e=>{if(!drag)return;const x=Math.max(-160,Math.min(160,e.clientX-drag.x)),y=Math.max(-100,Math.min(100,e.clientY-drag.y));$('#floating-card').style.transform=`translate(${x}px,${y}px)`});$('#drag-handle').addEventListener('pointerup',()=>drag=null);
    render();syncSettings();
  </script>
</body>
</html>
